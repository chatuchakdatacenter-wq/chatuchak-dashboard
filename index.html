<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ศูนย์รวมระบบฝึกอาชีพ เขตจตุจักร</title>

<style>

:root{
--bma:#007A5E;
--bma2:#00a884;
--dark:#021512;
--card:rgba(255,255,255,.05);
}

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

html,body{
margin:0;
padding:0;
height:100%;
background:#061c17;
color:white;
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:rgba(0,0,0,.35);
backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:14px;
padding:0 16px;
z-index:9999;
border-bottom:1px solid rgba(255,255,255,.08);
}

header h1{
margin:0;
font-size:18px;
font-weight:bold;
flex:1;
text-shadow:0 0 10px rgba(0,122,94,.7);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.menu-btn{
background:linear-gradient(135deg,var(--bma),var(--bma2));
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

.menu-btn:hover{
transform:scale(1.05);
}
</html>
